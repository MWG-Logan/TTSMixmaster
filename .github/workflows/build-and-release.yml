name: Build and Release TTSMixmaster

# Release = bump <Version> in Directory.Build.props and merge to main (docs/RELEASING.md).
# If tag v<Version> already exists, the run stops after the check job: no build, tag or release.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Rebuild and re-upload the release assets even if the version tag already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  WINAPP_VERSION: 'v0.8.0'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read version from Directory.Build.props
        id: version
        run: |
          version="$(dotnet msbuild Directory.Build.props -nologo -getProperty:Version | tr -d '[:space:]')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Directory.Build.props::<Version> must be MAJOR.MINOR.PATCH (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Decide whether to release
        id: gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            if [ "$FORCE" = "true" ]; then
              echo "Tag $tag exists; force_release requested, rebuilding and re-uploading assets."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $tag exists; nothing to release. Bump <Version> in Directory.Build.props to publish a new release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Tag $tag does not exist; building release $tag."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test tests/TTSMixmaster.Core.Tests -c Release

  build:
    needs: [check, test]
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # OIDC for azure/login
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    env:
      VERSION: ${{ needs.check.outputs.version }}
      ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.3.0
        with:
          version: ${{ env.WINAPP_VERSION }}

      - name: Publish app and fetch yt-dlp/ffmpeg
        run: ./scripts/package-release.ps1 -Arch $env:ARCH -Stage Publish

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only our own binaries. yt-dlp, ffmpeg and the .NET / Windows App SDK runtime files
      # are third-party and keep their publishers' signatures (or none).
      - name: Sign app binaries
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\artifacts\publish\${{ matrix.arch }}\TTSMixmaster.exe
            ${{ github.workspace }}\artifacts\publish\${{ matrix.arch }}\TTSMixmaster.dll
            ${{ github.workspace }}\artifacts\publish\${{ matrix.arch }}\TTSMixmaster.Core.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build portable zip, MSIs and MSIX
        run: ./scripts/package-release.ps1 -Arch $env:ARCH -Stage Package

      # The per-user MSI is signed before it is embedded in setup.exe.
      - name: Sign MSIs and MSIX
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\artifacts\release\TTSMixmaster-v${{ env.VERSION }}-${{ matrix.arch }}.msi
            ${{ github.workspace }}\artifacts\release\TTSMixmaster-v${{ env.VERSION }}-${{ matrix.arch }}.msix
            ${{ github.workspace }}\artifacts\work\${{ matrix.arch }}\TTSMixmaster.PerUser.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build setup.exe and detach its Burn engine
        run: ./scripts/package-release.ps1 -Arch $env:ARCH -Stage Bundle

      - name: Sign Burn engine
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\artifacts\work\${{ matrix.arch }}\burn-engine.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Reattach signed engine
        run: ./scripts/package-release.ps1 -Arch $env:ARCH -Stage Reattach

      - name: Sign setup.exe
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\artifacts\release\TTSMixmaster-v${{ env.VERSION }}-setup-${{ matrix.arch }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found.' }
          $release = Get-ChildItem artifacts/release -File | Where-Object { $_.Name -like "*-$env:ARCH.*" }
          if (@($release).Count -ne 4) { throw "Expected 4 release files for $env:ARCH, found: $($release.Name -join ', ')" }
          $signed = @($release | Where-Object Extension -ne '.zip') +
            @('TTSMixmaster.exe', 'TTSMixmaster.dll', 'TTSMixmaster.Core.dll' |
              ForEach-Object { Get-Item "artifacts/publish/$env:ARCH/$_" })
          foreach ($file in $signed) {
            & $signtool.FullName verify /pa /q $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature check failed: $($file.Name)" }
            Write-Output "Signed: $($file.Name)"
          }
          # The zip is built from the publish folder after signing, so its binaries are signed too.
          $release | ForEach-Object { '{0,-50} {1,8:N1} MB' -f $_.Name, ($_.Length / 1MB) }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, to find the previous release

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Check artifacts
        run: |
          ls -l dist
          for arch in x64 arm64; do
            for f in "portable-$arch.zip" "$arch.msi" "setup-$arch.exe" "$arch.msix"; do
              test -f "dist/TTSMixmaster-v$VERSION-$f" || { echo "::error::Missing TTSMixmaster-v$VERSION-$f"; exit 1; }
            done
          done
          test "$(find dist -type f | wc -l)" -eq 8 || { echo "::error::Expected exactly 8 release files"; exit 1; }

      - name: Write release notes header
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/TTSMixmaster-v$VERSION"
          cat > notes.md <<EOF
          ## Downloads

          Pick **x64** for most PCs and **ARM64** for Windows on Arm (Snapdragon) devices.

          | Format | x64 | ARM64 |
          |---|---|---|
          | **Installer, just for me** (no admin rights; installs to \`%LOCALAPPDATA%\\Programs\`) | [setup-x64.exe]($base-setup-x64.exe) | [setup-arm64.exe]($base-setup-arm64.exe) |
          | **Installer, all users** (MSI, needs admin; installs to Program Files) | [x64.msi]($base-x64.msi) | [arm64.msi]($base-arm64.msi) |
          | **MSIX package** | [x64.msix]($base-x64.msix) | [arm64.msix]($base-arm64.msix) |
          | **Portable** (unzip and run \`TTSMixmaster.exe\`) | [portable-x64.zip]($base-portable-x64.zip) | [portable-arm64.zip]($base-portable-arm64.zip) |

          Every installer, package and TTSMixmaster binary is code-signed with Azure Trusted Signing.
          yt-dlp and FFmpeg are bundled next to the app (FFmpeg is GPL v3; see \`ffmpeg-LICENSE.txt\` and \`scripts/fetch-tools.ps1\` for the pinned source release).

          EOF
          cat notes.md

      - name: Create or update GitHub release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists (force_release); replacing its assets."
            gh release upload "$tag" dist/* --clobber
            exit 0
          fi

          args=(--title "TTSMixmaster $tag" --notes-file notes.md --generate-notes)
          # A brand-new tag is created on the commit this run built.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            args+=(--target "$GITHUB_SHA")
          fi
          # Anchor the generated notes on the closest lower v* tag.
          prev="$(git tag --list 'v*' | grep -vxF "$tag" | { cat; echo "$tag"; } | sort -V | grep -B1 -xF "$tag" | grep -vxF "$tag" || true)"
          if [ -n "$prev" ]; then
            echo "Release notes since $prev"
            args+=(--notes-start-tag "$prev")
          fi
          gh release create "$tag" dist/* "${args[@]}"
