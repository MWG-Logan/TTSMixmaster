name: Build and Release TTSMixmaster

# Release = bump <Version> in Directory.Build.props and merge to main (docs/RELEASING.md).
# If tag v<Version> already exists, the run stops after the check job: no build, tag or release.
#
# Assets: TTSMixmaster.appinstaller + TTSMixmaster-v<ver>.msixbundle (x64 + ARM64, signed) and
# one portable zip per architecture.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Rebuild and re-upload the assets of the existing version tag (only when that tag is this commit)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  WINAPP_VERSION: 'v0.8.0'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read version from Directory.Build.props
        id: version
        run: |
          version="$(dotnet msbuild Directory.Build.props -nologo -getProperty:Version | tr -d '[:space:]')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Directory.Build.props::<Version> must be MAJOR.MINOR.PATCH (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Decide whether to release
        id: gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            if [ "$FORCE" = "true" ]; then
              # Tags are immutable in practice: force_release only re-uploads assets built from the
              # tagged commit itself. Different code needs a new version.
              git fetch --no-tags --depth=1 origin "+refs/tags/$tag:refs/tags/$tag"
              tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
              if [ "$tag_commit" != "$GITHUB_SHA" ]; then
                echo "::error file=Directory.Build.props::Tag $tag points at $tag_commit, but this run is building $GITHUB_SHA. force_release only rebuilds the tagged commit. To release this code, bump <Version> in Directory.Build.props."
                exit 1
              fi
              echo "Tag $tag is this commit; force_release requested, rebuilding and re-uploading assets."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $tag exists; nothing to release. Bump <Version> in Directory.Build.props to publish a new release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Tag $tag does not exist; building release $tag."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check, test]
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # OIDC for azure/login
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@9288bd0729bd3f71e2ed1b9eb247dc91470b824e # v0.3.0
        with:
          version: ${{ env.WINAPP_VERSION }}

      - name: Publish app and fetch yt-dlp/ffmpeg
        run: ./scripts/package-release.ps1 -Arch $env:ARCH -Stage Publish

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only our own binaries. yt-dlp, ffmpeg and the .NET / Windows App SDK runtime files
      # are third-party and keep their publishers' signatures (or none).
      - name: Sign app binaries
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\artifacts\publish\${{ matrix.arch }}\TTSMixmaster.exe
            ${{ github.workspace }}\artifacts\publish\${{ matrix.arch }}\TTSMixmaster.dll
            ${{ github.workspace }}\artifacts\publish\${{ matrix.arch }}\TTSMixmaster.Core.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify app binary signatures
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found.' }
          foreach ($name in 'TTSMixmaster.exe', 'TTSMixmaster.dll', 'TTSMixmaster.Core.dll') {
            & $signtool.FullName verify /pa /q "artifacts/publish/$env:ARCH/$name"
            if ($LASTEXITCODE -ne 0) { throw "Signature check failed: $name" }
            Write-Output "Signed: $name"
          }

      # The portable zip (released as is) and this architecture's unsigned .msix (bundled and
      # signed by the bundle job), both built from the signed publish folder.
      - name: Build portable zip and MSIX
        run: ./scripts/package-release.ps1 -Arch $env:ARCH -Stage Package

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.arch }}
          path: |
            artifacts/release/*-portable-${{ matrix.arch }}.zip
            artifacts/msix/*-${{ matrix.arch }}.msix
          if-no-files-found: error
          retention-days: 7

  bundle:
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # OIDC for azure/login
    env:
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@9288bd0729bd3f71e2ed1b9eb247dc91470b824e # v0.3.0
        with:
          version: ${{ env.WINAPP_VERSION }}

      # Lands as artifacts/release/*.zip and artifacts/msix/*.msix.
      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: artifacts

      - name: Build MSIX bundle and App Installer file
        run: ./scripts/package-release.ps1 -Stage Bundle -ReleasesUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases"

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Signing the bundle covers the x64 and ARM64 packages inside it. Its publisher
      # (installer/msix/Package.appxmanifest) must equal the certificate subject.
      - name: Sign MSIX bundle
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\artifacts\release\TTSMixmaster-v${{ env.VERSION }}.msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify bundle signature and release files
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found.' }
          & $signtool.FullName verify /pa /q "artifacts/release/TTSMixmaster-v$env:VERSION.msixbundle"
          if ($LASTEXITCODE -ne 0) { throw 'MSIX bundle signature check failed.' }
          $expected = @("TTSMixmaster-v$env:VERSION.msixbundle", 'TTSMixmaster.appinstaller',
            "TTSMixmaster-v$env:VERSION-portable-x64.zip", "TTSMixmaster-v$env:VERSION-portable-arm64.zip")
          foreach ($name in $expected) {
            $file = Get-Item "artifacts/release/$name"
            '{0,-48} {1,10:N1} MB' -f $file.Name, ($file.Length / 1MB)
          }
          Get-Content artifacts/release/TTSMixmaster.appinstaller

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [check, bundle]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.publish.outputs.created }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # tags, to find the previous release

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Check release files
        run: |
          ls -l dist
          for f in "TTSMixmaster-v$VERSION.msixbundle" TTSMixmaster.appinstaller \
                   "TTSMixmaster-v$VERSION-portable-x64.zip" "TTSMixmaster-v$VERSION-portable-arm64.zip"; do
            test -f "dist/$f" || { echo "::error::Missing $f"; exit 1; }
          done
          test "$(find dist -type f | wc -l)" -eq 4 || { echo "::error::Expected exactly 4 release files"; exit 1; }

      - name: Write release notes header
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          cat > notes.md <<NOTES
          ## Downloads

          **Recommended: [TTSMixmaster.appinstaller]($base/TTSMixmaster.appinstaller)**. Open it to install TTSMixmaster
          with App Installer. It installs the right build for your PC (x64 or ARM64) and keeps the app up to date.

          | Download | What it is |
          |---|---|
          | [TTSMixmaster.appinstaller]($base/TTSMixmaster.appinstaller) | **Install with automatic updates (recommended).** |
          | [TTSMixmaster-v$VERSION.msixbundle]($base/TTSMixmaster-v$VERSION.msixbundle) | The same signed MSIX package (x64 + ARM64) for offline installs and IT deployment (Intune, Configuration Manager). Installed directly, it doesn't update itself. |
          | [portable-x64.zip]($base/TTSMixmaster-v$VERSION-portable-x64.zip) | Portable for most PCs: unzip and run \`TTSMixmaster.exe\`. |
          | [portable-arm64.zip]($base/TTSMixmaster-v$VERSION-portable-arm64.zip) | Portable for Windows on Arm (Snapdragon) PCs. |

          The MSIX bundle and the TTSMixmaster binaries are code-signed with Azure Trusted Signing.
          yt-dlp and FFmpeg are bundled next to the app (FFmpeg is GPL; see \`ffmpeg-LICENSE.txt\` and \`scripts/fetch-tools.ps1\` for the pinned source releases).

          NOTES
          cat notes.md

      - name: Create or update GitHub release
        id: publish
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            # force_release: the check job only allows this when the tag is this commit; re-check here.
            tag_commit="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Release $tag is tagged at ${tag_commit:-an unknown commit}, not $GITHUB_SHA. Bump <Version> in Directory.Build.props to release this code."
              exit 1
            fi
            echo "Release $tag exists (force_release); replacing its assets."
            gh release upload "$tag" dist/* --clobber
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          args=(--title "TTSMixmaster $tag" --notes-file notes.md --generate-notes)
          # A brand-new tag is created on the commit this run built.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            args+=(--target "$GITHUB_SHA")
          fi
          # Anchor the generated notes on the closest lower v* tag.
          prev="$(git tag --list 'v*' | grep -vxF "$tag" | { cat; echo "$tag"; } | sort -V | grep -B1 -xF "$tag" | grep -vxF "$tag" || true)"
          if [ -n "$prev" ]; then
            echo "Release notes since $prev"
            args+=(--notes-start-tag "$prev")
          fi
          # Installed copies poll releases/latest/download/TTSMixmaster.appinstaller, so the
          # new release must become "latest".
          gh release create "$tag" dist/* --latest "${args[@]}"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # Optional winget submission for a newly created release (not for a force_release re-upload).
  # Called directly: a release created with GITHUB_TOKEN doesn't trigger `release: published` workflows.
  winget:
    needs: [check, release]
    if: needs.release.outputs.created == 'true' && vars.WINGET_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/winget.yml
    with:
      tag: v${{ needs.check.outputs.version }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
