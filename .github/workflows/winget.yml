name: Publish to winget

# Optional. Opens a winget-pkgs PR for each published release with Microsoft's wingetcreate.
# A no-op until the owner opts in (docs/RELEASING.md, "winget"):
#   repo variable WINGET_ENABLED = true
#   repo secret   WINGET_TOKEN   = classic PAT with public_repo scope (owner of a winget-pkgs fork)
#   repo variable WINGET_PACKAGE_ID (optional, default MorningwoodGaming.TTSMixmaster)
# The package must already exist in winget-pkgs (first submission is manual), because
# `wingetcreate update` only adds versions to an existing package.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit, e.g. v2.0.0'
        required: true
        type: string

permissions:
  contents: read

env:
  WINGETCREATE_VERSION: '1.28.1.0'
  WINGETCREATE_SHA256: '63d980ba79e97042395bd6eb5992c2db9e01e9e7a8a22958a95c288f27310413'  # wingetcreate.exe

jobs:
  winget:
    if: vars.WINGET_ENABLED == 'true' && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID || 'MorningwoodGaming.TTSMixmaster' }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require WINGET_TOKEN
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Output "::error title=WINGET_TOKEN is not set::WINGET_ENABLED is true but the WINGET_TOKEN secret is missing. See docs/RELEASING.md."
            exit 1
          }

      - name: Install wingetcreate ${{ env.WINGETCREATE_VERSION }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -UseBasicParsing -OutFile $exe `
            -Uri "https://github.com/microsoft/winget-create/releases/download/v$env:WINGETCREATE_VERSION/wingetcreate.exe"
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($actual -ne $env:WINGETCREATE_SHA256) { throw "wingetcreate.exe SHA-256 mismatch: $actual" }

      # winget gets the signed MSIX bundle, the same package the .appinstaller installs.
      # winget installs, upgrades and removes MSIX packages natively. The manifest has one
      # installer entry per architecture, both pointing at the bundle, hence the URL twice
      # with explicit architecture overrides.
      - name: Submit to winget-pkgs
        run: |
          $version = $env:TAG.TrimStart('v')
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/TTSMixmaster-v$version.msixbundle"
          & (Join-Path $env:RUNNER_TEMP 'wingetcreate.exe') update $env:PACKAGE_ID `
            --version $version `
            --urls "$url|x64" "$url|arm64" `
            --token $env:WINGET_TOKEN `
            --submit
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed with exit code $LASTEXITCODE" }
