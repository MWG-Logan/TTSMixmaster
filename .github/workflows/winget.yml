name: Publish to winget

# Optional. Submits a winget-pkgs PR for each published release with komac.
# A no-op until the owner opts in (docs/RELEASING.md, "winget"):
#   repo variable WINGET_ENABLED = true
#   repo secret   WINGET_TOKEN   = classic PAT with public_repo scope (owner of a winget-pkgs fork)
#   repo variable WINGET_PACKAGE_ID (optional, default MorningwoodGaming.TTSMixmaster)
# The package must already exist in winget-pkgs (first submission is manual), because
# `komac update` only adds versions to an existing package.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit, e.g. v2.0.0'
        required: true
        type: string

permissions:
  contents: read

env:
  KOMAC_VERSION: '2.17.2'
  KOMAC_SHA256: 'b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966'  # komac-2.17.2-x86_64-unknown-linux-gnu.tar.gz

jobs:
  winget:
    if: vars.WINGET_ENABLED == 'true' && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PACKAGE_ID: ${{ vars.WINGET_PACKAGE_ID || 'MorningwoodGaming.TTSMixmaster' }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Require WINGET_TOKEN
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::error title=WINGET_TOKEN is not set::WINGET_ENABLED is true but the WINGET_TOKEN secret is missing. See docs/RELEASING.md."
            exit 1
          fi

      - name: Install komac ${{ env.KOMAC_VERSION }}
        run: |
          archive="komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/$archive"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/komac"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/komac"
          komac="$(find "$RUNNER_TEMP/komac" -type f -name komac | head -n1)"
          chmod +x "$komac"
          dirname "$komac" >> "$GITHUB_PATH"

      # winget gets the MSIs: they carry ProductCode/UpgradeCode, so winget's install,
      # upgrade and uninstall detection is exact, and the per-machine MSI is the
      # "everyone on this PC" install a package manager is expected to do.
      - name: Submit to winget-pkgs
        env:
          KOMAC_NO_UPDATE_NOTIFIER: '1'
        run: |
          version="${TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/TTSMixmaster-v$version"
          komac update "$PACKAGE_ID" \
            --version "$version" \
            --urls "$base-x64.msi" "$base-arm64.msi" \
            --token "$WINGET_TOKEN" \
            --submit
